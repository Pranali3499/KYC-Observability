# prometheus.yml
# Scrape configuration for the Behavioral Observability Framework.
#
# kafka_consumer_etl.py exposes metrics on the Windows host (not
# inside a Docker container), so Prometheus -- itself running inside
# Docker -- needs host.docker.internal to reach it. This is Docker
# Desktop's built-in DNS name for "the machine Docker is running on",
# and works on Windows/Mac without extra configuration.

global:
  scrape_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "kyc-consumer"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "kyc-api"
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "drift-metrics"
    static_configs:
      - targets: ["host.docker.internal:8002"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100", "host.docker.internal:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
