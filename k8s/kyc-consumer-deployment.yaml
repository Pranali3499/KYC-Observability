apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-streaming-consumer
  namespace: kyc-production
  labels:
    app: kyc-streaming-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kyc-streaming-consumer
  template:
    metadata:
      labels:
        app: kyc-streaming-consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: kyc-consumer
          image: kyc-observability/consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: metrics
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KYC_DB_URL
              valueFrom:
                secretKeyRef:
                  name: kyc-db-secrets
                  key: database-url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
