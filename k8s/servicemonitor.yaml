apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyc-observability-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: kyc-scoring-api
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  endpoints:
    - port: metrics
      interval: 15s
