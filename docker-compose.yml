version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: kyc-postgres
    restart: always
    environment:
      POSTGRES_USER: kyc_user
      POSTGRES_PASSWORD: kyc_pass
      POSTGRES_DB: kyc_db
    ports:
      - "5432:5432"
    volumes:
      - kyc_pgdata:/var/lib/postgresql/data

  # Single-node Kafka broker using KRaft mode (no Zookeeper container
  # needed -- simpler for a dev/PoC setup than the older
  # Kafka+Zookeeper pairing). Two listeners are exposed:
  #   - PLAINTEXT_HOST (localhost:9092) -- for your Python scripts
  #     running on Windows, outside Docker
  #   - PLAINTEXT (kafka:29092) -- for other containers on the same
  #     Docker network, if you add more services later (e.g. a
  #     consumer running in its own container)
  kafka:
    image: apache/kafka:latest
    container_name: kyc-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kyc_kafka_data:/var/lib/kafka/data

  # Web UI for browsing Kafka topics/messages -- purely a convenience
  # for development and for taking report screenshots, not required
  # for the pipeline itself. Visit http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kyc-kafka-ui
    restart: always
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kyc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

volumes:
  kyc_pgdata:
  kyc_kafka_data:
