version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: kyc-postgres
    restart: always
    environment:
      POSTGRES_USER: kyc_user
      POSTGRES_PASSWORD: kyc_pass
      POSTGRES_DB: kyc_db
    ports:
      - "5432:5432"
    volumes:
      - kyc_pgdata:/var/lib/postgresql/data

volumes:
  kyc_pgdata:
